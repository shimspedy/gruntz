<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,700;1,700&family=Oswald:wght@600;700&family=Inter:wght@600;800&display=block" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#fff}
  .page{width:1080px;height:1350px;position:relative;background:#fff}
  .page:after{display:none;content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
    background:repeating-radial-gradient(circle at 30% 20%,rgba(0,0,0,.025) 0 1px,transparent 1px 3px)}
  .head{display:none;position:absolute;left:0;right:0;top:0;height:120px;background:#3f4a1f;display:flex;align-items:center;
    justify-content:space-between;padding:0 34px;border-bottom:5px solid #1b140f}
  .head h1{font-family:Oswald;font-weight:700;font-size:62px;letter-spacing:6px;color:#f1d36b;line-height:1}
  .head .ep{font-family:Kalam;font-weight:700;font-size:30px;color:#e9dfc4;text-align:right;line-height:1.05}
  .grid{position:absolute;left:10px;top:10px;width:1060px;height:1172px;display:grid;
    grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px}
  .panel{position:relative;border:none;overflow:hidden;background:#caa874}
  .panel svg.art{position:absolute;inset:0;width:100%;height:100%}
  .bub{position:absolute;background:#fff;border:none;border-radius:38px;box-shadow:0 2px 0 rgba(0,0,0,.08);
    padding:16px 24px;font-family:"Comic Neue";font-weight:700;font-size:29px;line-height:1.08;text-align:center;color:#1b140f;z-index:3}
  .bub em{font-style:italic;font-weight:700;font-size:1.15em;-webkit-text-stroke:.8px #1b140f}
  .cap{position:absolute;left:12px;top:12px;background:#1b140f;color:#f6e7b0 !important;border:none;border-radius:6px;
    font-family:"Comic Neue";font-weight:700;font-size:24px;padding:4px 14px 2px;z-index:4;color:#1b140f}
  .phone{position:absolute;background:#0d0d0f;border:4px solid #1b140f;border-radius:28px;padding:11px;z-index:2;
    box-shadow:0 0 0 2px #555 inset,0 0 40px rgba(130,190,255,.35)}
  .screen{background:#17181b;border-radius:17px;height:100%;padding:13px;color:#fff;font-family:Inter;overflow:hidden}
  .screen .hd{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;letter-spacing:.5px}
  .screen .hd img{width:24px;height:24px;border-radius:6px}
  .screen .k{font-size:11px;color:#7fb2ff;font-weight:800;letter-spacing:1px;margin-top:12px}
  .screen .m{font-size:20px;font-weight:800;line-height:1.1;margin-top:4px}
  .screen .l{font-size:13px;color:#c9c9cf;margin-top:8px;line-height:1.35;font-weight:600}
  .screen .btn{margin-top:12px;background:#fff;color:#111;border-radius:11px;text-align:center;font-weight:800;font-size:14px;padding:8px 0}
  .screen .big{font-size:56px;font-weight:800;text-align:center;margin-top:10px;line-height:1}
  .screen .sub{font-size:13px;text-align:center;color:#ffb648;font-weight:800;letter-spacing:1px}
  .foot{position:absolute;left:10px;right:10px;top:1192px;height:148px;background:#141210;border:none;
    display:flex;align-items:center;gap:22px;padding:0 24px}
  .foot img{width:104px;height:104px;border-radius:24px;border:3px solid #333}
  .foot .t{flex:1;color:#fff}
  .foot .t .a{font-family:Oswald;font-weight:700;font-size:40px;letter-spacing:1.5px;color:#fff;line-height:1.05}
  .foot .t .b{font-family:Inter;font-weight:600;font-size:17px;color:#bdbdbd;margin-top:8px;line-height:1.3}
  .foot .cta{font-family:Oswald;font-weight:700;font-size:30px;letter-spacing:1px;background:#f1d36b;color:#1b140f;
    border:3px solid #1b140f;padding:12px 20px 10px;white-space:nowrap;border-radius:6px}
</style></head>
<body><div class="page" id="page"></div>
<script>
const ICON='icon.png', INK='#1b140f';
const SKIN={a:['#f2bf98','#d8946b','#b8714c'],b:['#c98e62','#a86d45','#8a5232'],c:['#8a5a3b','#6c4229','#55311d']};
const defs=`<defs>
<filter id="ink" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/></filter>
<pattern id="cam" width="110" height="110" patternUnits="userSpaceOnUse">
 <rect width="110" height="110" fill="#7a7348"/>
 <path d="M6 12q24-14 36 5t-10 24q-24 5-26-29z" fill="#4c5530"/><path d="M60 46q28-10 38 12t-24 22q-22-2-14-34z" fill="#3a3324"/>
 <path d="M34 74q12-7 22 7t-14 19q-17-5-8-26z" fill="#9f9265"/><path d="M72 4q17 0 19 14t-17 10q-12-10-2-24z" fill="#9f9265"/>
 <path d="M8 60q10-5 15 5t-7 12q-12-2-8-17z" fill="#3a3324"/></pattern>
<pattern id="block" width="80" height="40" patternUnits="userSpaceOnUse"><rect width="80" height="40" fill="none"/><path d="M0 39.5H80M40 0V20M0 19.5H80M0 0V20M80 20V40" stroke="rgba(60,40,20,.28)" stroke-width="2" fill="none"/></pattern>
<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7dc84"/><stop offset="1" stop-color="#e8a24a"/></linearGradient><linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9c46f"/><stop offset="1" stop-color="#c9773c"/></linearGradient><radialGradient id="warm" cx="55%" cy="20%" r="80%"><stop offset="0" stop-color="#ffe6a8" stop-opacity=".55"/><stop offset="1" stop-color="#5a3a1a" stop-opacity=".35"/></radialGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#9fd0ff" stop-opacity=".55"/><stop offset="1" stop-color="#9fd0ff" stop-opacity="0"/></radialGradient>
</defs>`;

// ---------- character: 3/4 bust facing right; f=-1 mirrors ----------
function guy(o){
  const {cx,cy,s=1,f=1,skin='a',hair='hnt',shirt='cam',ex='n',stache=false,sweat=false,lit=false}=o;
  const [k,ks,kd]=SKIN[skin];
  const sw=w=>`stroke-width="${w/s}"`;
  let g=`<g transform="translate(${cx} ${cy}) scale(${s*f} ${s})" stroke="${INK}" stroke-linejoin="round" stroke-linecap="round" ${sw(4.5)}>`;
  // torso
  const top = shirt==='cam'?'url(#cam)':shirt==='pt'?'#5d6a33':shirt==='hood'?'#2f3d55':'#777';
  g+=`<path d="M-175 360 C-170 210 -120 150 -42 128 L48 128 C130 150 175 210 180 360 Z" fill="${top}"/>`;
  g+=`<path d="M-175 360 C-170 230 -130 170 -70 140 C-100 200 -110 280 -100 360 Z" fill="rgba(30,20,10,.32)" stroke="none"/>`;
  if(shirt==='cam'){ g+=`<path d="M-48 128 L-6 205 L-60 190 Z" fill="#6b6440"/><path d="M52 128 L-2 205 L58 190 Z" fill="#7a7348"/>
     <path d="M-6 205 L-2 360" fill="none" ${sw(3)}/><path d="M-120 260 q20 10 40 0 M90 250 q20 12 44 2" fill="none" ${sw(3)}/>`;}
  if(shirt==='pt'){ g+=`<path d="M-46 128 C-30 160 34 160 50 128" fill="#4c5729"/><path d="M-80 240 q14 30 4 80 M96 230 q-10 40 0 90" fill="none" ${sw(2.5)}/>`;}
  if(shirt==='hood'){ g+=`<path d="M-90 140 C-60 110 70 108 100 140 C60 170 -50 172 -90 140Z" fill="#26324a"/>
     <path d="M-14 168 l-4 70 M18 168 l4 74" fill="none" ${sw(3)}/><circle cx="-18" cy="242" r="5" fill="#ddd"/><circle cx="22" cy="246" r="5" fill="#ddd"/>`;}
  // neck
  g+=`<path d="M-30 70 L-34 136 C-10 150 20 150 40 136 L36 70 Z" fill="${k}"/><path d="M-30 74 C-10 104 20 104 36 80 L36 98 C14 120 -14 118 -32 100Z" fill="${ks}" stroke="none"/>`;
  // ear (back side)
  g+=`<path d="M-56 -18 C-80 -26 -84 22 -60 30" fill="${k}"/><path d="M-62 -8 C-72 -4 -72 14 -62 18" fill="none" ${sw(2.5)}/>`;
  // head
  g+=`<path d="M-58 -40 C-60 -104 58 -110 62 -42 C66 -10 70 8 64 26 C58 52 48 70 30 82 C16 92 -10 92 -26 80 C-48 62 -60 26 -58 -40Z" fill="${k}"/>`;
  g+=`<path d="M-58 -40 C-60 20 -48 60 -26 80 C-38 48 -42 8 -36 -34 C-30 -60 -10 -76 10 -82 C-30 -84 -56 -70 -58 -40Z" fill="${ks}" stroke="none"/>`;
  if(lit) g+=`<path d="M64 26 C58 52 48 70 30 82 C40 60 46 40 50 20Z" fill="#bfe0ff" opacity=".55" stroke="none"/>`;
  // stubble jaw
  g+=`<path d="M-40 40 C-30 74 0 92 30 82 C50 70 60 52 64 30 C40 60 0 70 -40 40Z" fill="${kd}" opacity=".18" stroke="none"/>`;
  // hair
  if(hair==='hnt'){ g+=`<path d="M-52 -58 C-46 -100 52 -104 58 -56 C40 -70 -20 -74 -52 -58Z" fill="#3b2a1d"/>
     <path d="M-58 -40 C-58 -50 -55 -56 -52 -58 C-20 -74 40 -70 58 -56 L60 -44 C40 -56 -20 -58 -56 -30Z" fill="rgba(70,50,35,.45)" stroke="none"/>`;}
  if(hair==='grey'){ g+=`<path d="M-54 -56 C-46 -98 52 -102 58 -54 C40 -66 -20 -70 -54 -56Z" fill="#9b9b97"/>
     <path d="M-58 -40 C-58 -50 -56 -54 -54 -56 C-20 -70 40 -66 58 -54 L60 -44 C40 -54 -20 -56 -56 -30Z" fill="rgba(150,150,150,.6)" stroke="none"/>`;}
  // brows / eyes / mouth by expression (eyes at -2 and 36, y -14)
  const E=(x,y=-14)=>`<path d="M${x-12} ${y} Q${x} ${y-10} ${x+12} ${y} Q${x} ${y+8} ${x-12} ${y}Z" fill="#fff" ${sw(2)}/><circle cx="${x+3}" cy="${y}" r="5" fill="#2a1d16" stroke="none"/><path d="M${x-13} ${y+1} Q${x} ${y-12} ${x+13} ${y-1}" fill="none" ${sw(4)}/>`;
  const Lid=(x,y=-14)=>`<path d="M${x-13} ${y-1} Q${x} ${y-12} ${x+13} ${y-1} L${x+13} ${y+1} L${x-13} ${y+1}Z" fill="${k}" ${sw(0)} stroke="none"/><path d="M${x-13} ${y+1} L${x+13} ${y}" fill="none" ${sw(4)}/>`;
  const B=(x1,y1,x2,y2,w=7)=>`<path d="M${x1} ${y1} Q${(x1+x2)/2} ${Math.min(y1,y2)-4} ${x2} ${y2}" fill="none" ${sw(w)}/>`;
  if(ex==='n')     g+=E(-2)+E(36)+B(-16,-32,10,-34)+B(24,-34,50,-31)+`<path d="M6 48 Q20 50 34 46" fill="none" ${sw(3.5)}/>`;
  if(ex==='blank') g+=E(-2)+E(36)+Lid(-2)+Lid(36)+B(-16,-36,10,-38)+B(24,-38,50,-35)+`<path d="M10 50 L30 49" fill="none" ${sw(3.5)}/>`;
  if(ex==='worry') g+=E(-2,-12)+E(36,-12)+B(-16,-28,8,-38)+B(26,-38,50,-28)+`<path d="M4 52 q8 -7 16 0 t16 0" fill="none" ${sw(3.5)}/>`;
  if(ex==='panic'){g+=`<circle cx="-2" cy="-14" r="14" fill="#fff" ${sw(2.5)}/><circle cx="36" cy="-14" r="14" fill="#fff" ${sw(2.5)}/><circle cx="0" cy="-14" r="3.5" fill="#2a1d16" stroke="none"/><circle cx="38" cy="-14" r="3.5" fill="#2a1d16" stroke="none"/>`
     +B(-18,-40,10,-48)+B(24,-48,52,-40)+`<path d="M6 40 C6 74 36 74 36 40 Q20 34 6 40Z" fill="#5c1a14"/><path d="M8 42 Q20 38 34 42" fill="#fff" ${sw(2)}/>`;}
  if(ex==='smile') g+=`<path d="M-14 -12 Q-2 -24 10 -12 M24 -12 Q36 -24 48 -12" fill="none" ${sw(4.5)}/>`+B(-16,-34,10,-38)+B(24,-38,50,-34)
     +`<path d="M2 40 C8 66 40 64 44 38 Q22 46 2 40Z" fill="#fff" ${sw(3)}/><path d="M6 44 Q22 50 40 42" fill="none" ${sw(2)}/>`;
  if(ex==='smug')  g+=E(-2)+E(36)+Lid(-2,-12)+Lid(36,-12)+B(-16,-30,10,-32)+B(24,-40,50,-38)+`<path d="M4 50 Q22 54 38 40" fill="none" ${sw(3.5)}/>`;
  if(ex==='tired') g+=E(-2)+E(36)+Lid(-2,-11)+Lid(36,-11)+B(-16,-32,10,-32)+B(24,-32,50,-30)
     +`<path d="M-12 -2 q10 6 20 0 M26 -2 q10 6 20 0" fill="none" stroke="${kd}" ${sw(2.5)}/><path d="M8 50 L32 47" fill="none" ${sw(3.5)}/>`;
  if(ex==='grit')  g+=E(-2,-12)+E(36,-12)+`<path d="M-15 -24 L-15 -20 L12 -16 L12 -20Z" fill="${k}" stroke="none"/>`+B(-18,-26,12,-20,8)+B(22,-20,52,-28,8)
     +`<rect x="4" y="40" width="34" height="14" rx="3" fill="#fff" ${sw(3)}/><path d="M13 40v14M21 40v14M29 40v14" fill="none" ${sw(1.6)}/>`;
  // nose
  g+=`<path d="M18 -6 C22 8 30 18 28 24 C24 28 16 28 12 25" fill="none" ${sw(3.5)}/><path d="M18 -6 C14 6 12 16 12 25 C8 20 10 6 18 -6Z" fill="${ks}" stroke="none"/>`;
  if(stache) g+=`<path d="M-2 36 C6 28 18 30 22 34 C28 30 40 30 46 38 C40 46 26 44 22 40 C16 46 2 46 -2 36Z" fill="#8d8d88"/>`;
  if(sweat)  g+=`<path d="M70 -54 q12 20 0 30 q-12 -10 0 -30Z M-70 -30 q9 16 0 24 q-9 -8 0 -24Z" fill="#a8d8ff" ${sw(2.5)}/>`;
  return g+'</g>';
}
function tail(x1,y1,x2,y2,w=24){const a=Math.atan2(y2-y1,x2-x1)+Math.PI/2,dx=Math.cos(a)*w/2,dy=Math.sin(a)*w/2,mx=(x1+x2)/2+dx*.6,my=(y1+y2)/2+dy*.6;
  return `<path d="M${x1-dx} ${y1-dy} Q${mx} ${my} ${x2} ${y2} Q${mx-dx*.5} ${my-dy*.5} ${x1+dx} ${y1+dy}Z" fill="#fff"/>`}

// ---------- backgrounds ----------
const light=``;
const bg={
 gym:`<rect y='-50' width='540' height='620' fill='url(#sun)'/><g fill='#d68f3e' opacity='.55'><rect x='20' y='120' width='14' height='450'/><rect x='120' y='120' width='14' height='450'/><rect x='10' y='112' width='134' height='12'/><rect x='360' y='240' width='150' height='9'/><ellipse cx='372' cy='244' rx='12' ry='38'/><ellipse cx='500' cy='244' rx='12' ry='38'/></g>`,
 barracks:`<rect y='-50' width='540' height='620' fill='url(#sun)'/><g fill='#d99446' opacity='.5'><rect x='330' y='60' width='150' height='110' rx='4'/><rect x='20' y='80' width='120' height='500'/></g>`,
 couch:`<rect y='-50' width='540' height='620' fill='url(#sun)'/><g fill='#d99446' opacity='.5'><rect x='350' y='70' width='130' height='90' rx='4'/></g>`,
 couchFront:`<g transform='translate(0 150)'><path d="M-10 392 Q-10 340 40 340 L470 340 Q520 340 520 392 L540 620 L-10 620Z" fill="#7b3e2b" stroke="${INK}" stroke-width="5"/>
  <path d="M-10 392 Q-10 340 40 340 L470 340 Q300 360 -10 420Z" fill="#94503a" opacity=".6"/><path d="M170 350 v260 M340 350 v260" stroke="#4e2418" stroke-width="3"/>
  <path d="M60 300 l14 52 h22 l14 -52z" fill="#3fa34d" stroke="${INK}" stroke-width="3"/></g>`,
 door:`<rect y='-50' width='540' height='620' fill='url(#dusk)'/><rect x='290' y='20' width='240' height='560' fill='#b8692f' opacity='.55'/>`,
 office:`<rect y='-50' width='540' height='620' fill='url(#sun)'/><g fill='#d99446' opacity='.5'><rect x='24' y='100' width='130' height='480'/><rect x='200' y='50' width='110' height='80' rx='3'/></g>`,
 night:`<rect y='-50' width='540' height='620' fill='#1c2338'/><rect x='340' y='60' width='140' height='110' rx='4' fill='#141a2b'/><circle cx='430' cy='100' r='16' fill='#efe8c4' opacity='.8'/><ellipse cx='255' cy='330' rx='240' ry='230' fill='url(#glow)'/>`,
 burst:`<rect width="510" height="492" fill="#f1c84e"/>${Array.from({length:22},(_,i)=>{const a=i*Math.PI/11,b=a+Math.PI/22;return `<path d="M255 246 L${255+700*Math.cos(a)} ${246+700*Math.sin(a)} L${255+700*Math.cos(b)} ${246+700*Math.sin(b)}Z" fill="#f7da78"/>`}).join('')}`,
};
const phone=(x,y,w,h,inner,rot=0)=>`<div class="phone" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${rot}deg)"><div class="screen">${inner}</div></div>`;
const hd=`<div class="hd"><img src="${ICON}">GRUNTZ</div>`;
const panel=(svg,html='')=>`<div class="panel"><svg class="art" viewBox="0 0 525 581">${defs}${svg}</svg>${html}</div>`;
const bub=(x,y,w,t,fs)=>`<div class="bub" style="left:${x}px;top:${y}px;width:${w}px;${fs?`font-size:${fs}px`:''}">${t}</div>`;
const cap=t=>`<div class="cap">${t}</div>`;

// P: background, svg chars, bubbles [{x,y,w,h,t,sx,tx,ty,fs}], extra html, caption
function P(b,chars,bubs,extra='',c=''){
  const tails=bubs.map(q=>tail(q.sx??(q.x+q.w/2),q.y+q.h-12,q.tx,q.ty,22)).join('');
  const html=bubs.map(q=>bub(q.x,q.y,q.w,q.t,q.fs)).join('');
  return panel(b+chars+tails,(c?cap(c):'')+html+extra);
}
const ADS={
 orders:{foot:['ORDERS. FOR YOUR WORKOUT.','A new mission every day. No drill instructor required.'],panels:[
  P(bg.gym,guy({cx:270,cy:340,s:1.25,shirt:'hood',ex:'n'}),[{x:40,y:70,w:300,h:64,t:'Okay. Gym. <em>Easy.</em>',sx:220,tx:310,ty:205}],'','Day 1 as a civilian.'),
  P(bg.gym,guy({cx:262,cy:340,s:1.25,shirt:'hood',ex:'blank'}),[{x:60,y:56,w:400,h:64,t:'...Nobody’s yelling at me.',tx:290,ty:200}]),
  P(bg.gym,guy({cx:262,cy:330,s:1.55,shirt:'hood',ex:'panic',sweat:true}),[{x:28,y:26,w:470,h:64,t:'Do I just... <em>pick something?!</em>',sx:380,tx:395,ty:160}]),
  P(bg.burst,guy({cx:160,cy:360,s:1.05,shirt:'hood',ex:'smile'}),[{x:20,y:50,w:250,h:96,t:'Finally.<br><em>Orders.</em>',sx:150,tx:185,ty:240}],
    phone(300,110,190,330,hd+`<div class="k">TODAY'S MISSION</div><div class="m">5 ROUNDS</div><div class="l">10 pull-ups<br>20 push-ups<br>30 air squats</div><div class="btn">START</div>`,6)),
 ]},
 monday:{foot:['NO MORE “MONDAY.”','Today’s mission is ready. Build the streak. Earn the rank.'],panels:[
  P(bg.couch,guy({cx:250,cy:300,s:1.15,shirt:'pt',ex:'smug'})+bg.couchFront,[{x:30,y:66,w:330,h:64,t:'I’ll start <em>Monday.</em>',sx:220,tx:280,ty:190}],'','6 weeks to the PFT'),
  P(bg.couch,guy({cx:250,cy:300,s:1.15,shirt:'pt',ex:'smug'})+bg.couchFront,[{x:150,y:70,w:230,h:64,t:'<em>Monday.</em>',sx:270,tx:285,ty:190}],'','3 weeks to the PFT'),
  P(bg.door,guy({cx:410,cy:290,s:1.0,f:-1,shirt:'cam',ex:'n'})+guy({cx:160,cy:400,s:1.05,shirt:'pt',ex:'panic',sweat:true}),
    [{x:140,y:56,w:300,h:96,t:'PFT’s <em>tomorrow,</em> devil.',sx:370,tx:385,ty:205}],'','1 day to the PFT'),
  P(bg.barracks,guy({cx:230,cy:340,s:1.2,shirt:'pt',ex:'grit'}),[{x:20,y:66,w:240,h:96,t:'Starting<br><em>today.</em>',sx:160,tx:235,ty:215}],
    phone(315,200,185,260,hd+`<div class="big">1</div><div class="sub">DAY STREAK</div><div class="btn">MISSION DONE</div>`,-5),'Don’t be that guy.'),
 ]},
 streak:{foot:['DISCIPLINE, ON A STREAK.','Show up. Finish the mission. Don’t break the chain.'],panels:[
  P(bg.office,guy({cx:385,cy:330,s:1.05,f:-1,hair:'grey',stache:true,ex:'tired'})+guy({cx:115,cy:400,s:.85,ex:'n'}),
    [{x:150,y:30,w:350,h:96,t:'Motivation is temporary, devil.',sx:390,tx:395,ty:212}]),
  P(bg.office,guy({cx:262,cy:340,s:1.25,ex:'worry'}),[{x:70,y:56,w:390,h:64,t:'So what lasts, <em>Gunny?</em>',tx:290,ty:200}]),
  P(bg.office,guy({cx:165,cy:350,s:1.05,hair:'grey',stache:true,ex:'smug'}),[{x:15,y:30,w:300,h:96,t:'A streak you’re too proud to break.',fs:27,sx:160,tx:200,ty:232}],
    phone(310,130,185,290,hd+`<div class="big">214</div><div class="sub">DAY STREAK</div><div class="l" style="text-align:center">Rank: Operator</div>`,6)),
  P(bg.night,guy({cx:262,cy:340,s:1.25,ex:'grit',shirt:'pt'}),[{x:130,y:72,w:270,h:64,t:'...Day <em>one.</em>',tx:290,ty:200}],'','0430. Next day.'),
 ]},
};
const id=new URLSearchParams(location.search).get('ad')||'orders', A=ADS[id];
document.getElementById('page').innerHTML=
